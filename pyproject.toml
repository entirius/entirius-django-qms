[project]
name = "entirius-django-qms"
version = "4.0.1"
description = "Quantity Management System — warehouse-level stock management for Volkanos"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.0",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "celery>=5.0",
    "celery-once>=3.0.1",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
    "entirius-django-utils>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    "dj-database-url",
    "psycopg[binary]",
    "entirius-django-regional>=2.0.0",
    "entirius-django-pim>=3.0.0",
]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-qms"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_qms"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]
# Legacy migrated 1:1 (xray/zulu pipeline models)
"src/django_qms/models/**" = ["DJ008", "DJ012", "UP031"]
"src/django_qms/storage_managers.py" = ["B904", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["django_qms"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# django_checkout: optional integration (lazy imports, try/except ImportError fallbacks)
DEP001 = ["django_checkout"]
# django_pim: optional integration in src (lazy import), hard-required only by the test suite
DEP004 = ["django_pim"]
